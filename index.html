<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Landfall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@300;400;500&display=swap">
<style>
/* Layout: the 1280×832 "MacBook Air" artboard from playground start, scaled to fit; sketch map on canvas beneath, Figma UI on top.
   Deliberately single-theme: a white sketchbook page with brown pencil ink. */
:root{
  --paper:#ffffff;
  --ink:#6b4e4e;
  --ink-strong:#2f2727;
  --text:#111111;
  --title:#4a4545;
  --rule:#a7a3a3;
  --muted:#8e7f7f;
  --survival:#a87471;
  --track:#f1e8e7;
  --heat:#c9692c;
  --font:"Fira Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--text);font-family:var(--font);overflow:hidden;margin:0;-webkit-user-select:none;user-select:none}
#nameInput{-webkit-user-select:text;user-select:text}
[hidden]{display:none!important}
#stage{position:fixed;inset:0;background:var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#cv.pan{cursor:grab}
#cv.panning{cursor:grabbing}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.5}
#design{position:absolute;left:0;top:0;width:1280px;height:832px;transform-origin:0 0;pointer-events:none}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* navbar — Figma instance "navbar" 392×67 @ (434,698) */
#navbar{position:absolute;left:434px;top:698px;width:392px;height:67px;box-sizing:border-box;border:1px solid var(--ink);border-radius:34px;background:var(--paper);display:flex;align-items:center;justify-content:space-evenly;padding:0 8px;pointer-events:auto;opacity:.92}
.tool{width:50px;height:50px;border:0;background:transparent;border-radius:27px;display:grid;place-items:center;cursor:pointer;color:var(--ink);position:relative;padding:0}
.tool svg{width:36px;height:36px}
.tool:hover{background:var(--track)}
.tool[aria-pressed="true"]::after{content:"";position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ink)}

/* name pill — Figma "Frame 15" 338×82 */
#namePill{position:absolute;width:338px;height:82px;box-sizing:border-box;border:1.5px solid var(--ink);border-radius:41px;background:var(--paper);display:flex;align-items:center;gap:26px;padding:0 30px;pointer-events:auto;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
#namePill svg{width:40px;height:40px;color:var(--ink);flex:none}
#nameInput{width:180px;border:0;border-bottom:2px solid var(--ink-strong);background:transparent;font:300 22px var(--font);color:var(--ink-strong);padding:10px 0 2px;margin-top:14px;outline:none;border-radius:0}

/* island card — Figma "Frame 25" 395×318 */
#card{position:absolute;width:395px;box-sizing:border-box;border:1.5px solid var(--ink);border-radius:34px;background:var(--paper);padding:14px 30px 26px 36px;pointer-events:auto;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
#card h2{font-weight:300;font-size:44px;line-height:1.15;color:var(--title);margin:0 0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:grid;grid-template-columns:130px minmax(0,1fr);align-items:center;min-height:52px;font-size:22px;font-weight:300}
.val{font-size:15px;font-weight:400;color:var(--muted);line-height:1.3}
.bar{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:400;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.track{width:120px;height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.fill{height:100%;border-radius:5px;background:var(--survival);transition:width .6s}
.ctl{position:absolute;top:-48px;right:-38px;display:flex;gap:10px}
.ctl button{width:40px;height:40px;border:0;background:transparent;cursor:pointer;color:var(--ink);padding:0;display:grid;place-items:center}
.ctl svg{width:34px;height:34px}
#cardMini{position:absolute;height:40px;box-sizing:border-box;border:1.5px solid var(--ink);border-radius:20px;background:var(--paper);display:flex;align-items:center;gap:10px;padding:0 8px 0 20px;font-size:18px;font-weight:300;color:var(--title);pointer-events:auto;cursor:pointer}
#cardMini svg{width:24px;height:24px;color:var(--ink)}

/* map annotations — Figma text "Potential Volcano" / "Bay" */
#labels{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);font:400 20px var(--font);color:var(--text);white-space:nowrap}
button.lbl{pointer-events:auto;border:0;background:transparent;cursor:pointer;padding:0 2px;border-bottom:1.5px dashed var(--ink)}
button.lbl:hover{color:var(--ink)}
.lbl.small{font-size:15px;color:var(--ink)}
.lbl.hot{font-size:15px;color:var(--heat);font-style:italic}

#popStack{position:absolute;display:flex;flex-direction:column;gap:10px;pointer-events:none;z-index:6}
#popStack .toast{cursor:pointer;font-size:13.5px;padding:11px 36px 11px 16px;box-shadow:0 1px 0 var(--track)}
#popStack .toast .nt{display:block;font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
#popStack .toast.out{opacity:0;transform:translateX(12px);transition:opacity .45s,transform .45s}
/* notes tab: a bookmark sticking out of the frame's right edge, and the drawer it opens */
#notesTab{position:absolute;left:1236px;top:96px;width:34px;height:116px;box-sizing:border-box;border:1px solid var(--ink);border-left:0;border-radius:0 16px 16px 0;background:var(--paper);color:var(--ink);cursor:pointer;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0;font:400 13px var(--font)}
#notesTab:hover,#notesTab[aria-expanded="true"]{background:var(--track)}
#notesTab .lbl-v{writing-mode:vertical-rl;letter-spacing:.06em}
#notesCount{min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--paper);font-size:10.5px;line-height:18px;text-align:center;padding:0 4px;box-sizing:border-box;font-variant-numeric:tabular-nums}
#notesTab.ping{animation:ping .9s ease-out}
@keyframes ping{0%{transform:translateX(0)}25%{transform:translateX(5px)}50%{transform:translateX(0)}75%{transform:translateX(3px)}100%{transform:translateX(0)}}
#notesPanel{position:absolute;right:44px;top:62px;width:360px;max-height:600px;box-sizing:border-box;border:1.25px solid var(--ink);border-radius:22px;background:var(--paper);pointer-events:auto;display:flex;flex-direction:column;animation:pop .25s ease-out;z-index:4}
#notesPanel header{display:flex;align-items:center;gap:12px;padding:14px 16px 10px 20px;border-bottom:1px solid var(--track)}
#notesPanel h3{margin:0;font-weight:300;font-size:22px;color:var(--title);flex:1}
#notesPanel header button{border:0;background:transparent;font:400 13px var(--font);color:var(--muted);cursor:pointer;padding:4px}
#notesPanel header button:hover{color:var(--ink)}
#notesList{list-style:none;margin:0;padding:6px 0;overflow-y:auto;min-height:0}
#notesList li{padding:10px 20px;font-size:14px;line-height:1.45;color:var(--ink-strong);border-bottom:1px dashed var(--track)}
#notesList li:last-child{border-bottom:0}
#notesList .nt{display:block;font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
#notesList .act{border:0;background:transparent;padding:0;margin-top:4px;font:500 13px var(--font);color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;display:block}
#notesEmpty{padding:16px 20px 20px;font-size:14px;color:var(--muted);margin:0}
.toast{pointer-events:auto;position:relative;border:1.25px solid var(--ink);border-radius:22px;background:var(--paper);padding:12px 42px 12px 18px;font-size:15px;line-height:1.45;color:var(--ink-strong);animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
.toast .act{border:0;background:transparent;padding:0;margin-top:4px;font:500 14px var(--font);color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;display:block}
.toast .x{position:absolute;right:10px;top:8px;width:26px;height:26px;border:0;background:transparent;cursor:pointer;color:var(--ink);font-size:18px;line-height:1}

#hint{display:none!important;position:absolute;left:0;width:1280px;top:672px;text-align:center;font-size:14px;color:var(--muted);pointer-events:none}
#empty{display:none!important;position:absolute;left:0;width:1280px;top:388px;text-align:center;font-size:24px;font-weight:300;color:var(--muted);pointer-events:none}
#topbar{position:absolute;right:44px;top:2px;display:flex;gap:18px;pointer-events:auto}
#topbar button{border:0;background:transparent;font-size:13px;color:var(--muted);cursor:pointer;padding:4px 2px}
#topbar button:hover{color:var(--ink)}
.zoom{display:flex;align-items:center;gap:2px;margin-right:10px}
.zoom button{font-variant-numeric:tabular-nums}
#zoomIn,#zoomOut{font-size:17px!important;width:24px;line-height:1}

#compass{position:absolute;left:62px;top:672px;width:112px;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:auto;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
#compass svg{width:68px;height:68px;cursor:grab;touch-action:none;color:var(--ink)}
#compass span{font-size:11px;color:var(--muted);text-align:center;line-height:1.25}
#needle{transition:transform .25s}


/* time controls + layers — same outline language as the navbar */
#timePill{position:absolute;left:170px;top:698px;width:256px;height:67px;box-sizing:border-box;border:1px solid var(--ink);border-radius:34px;background:var(--paper);display:flex;align-items:center;gap:8px;padding:0 10px 0 8px;pointer-events:auto;opacity:.95}
#playBtn{width:46px;height:46px;border-radius:23px;border:0;background:transparent;cursor:pointer;color:var(--ink);display:grid;place-items:center;flex:none;padding:0}
#playBtn:hover,#speedBtn:hover,.lyr:hover{background:var(--track)}
#playBtn svg{width:26px;height:26px}
.tbox{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.2}
#timeTxt{font-size:15px;color:var(--ink-strong);font-variant-numeric:tabular-nums;white-space:nowrap}
#ageTxt{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#speedBtn{border:1px solid var(--rule);border-radius:12px;background:transparent;font-size:11px;color:var(--ink);padding:4px 7px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
#layers{position:absolute;left:842px;top:706px;width:262px;box-sizing:border-box;border:1px solid var(--ink);border-radius:26px;background:var(--paper);display:flex;flex-wrap:wrap;justify-content:center;gap:2px 4px;padding:6px 10px;pointer-events:auto;opacity:.95}
.lyr{border:0;background:transparent;font-size:12px;color:var(--muted);padding:3px 6px;border-radius:10px;cursor:pointer}
.lyr[aria-pressed="true"]{color:var(--ink-strong);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
#tip{position:absolute;max-width:300px;box-sizing:border-box;border:1.25px solid var(--ink);border-radius:14px;background:var(--paper);padding:9px 12px;font-size:13px;line-height:1.4;color:var(--ink-strong);pointer-events:none;z-index:5}
#tip b{font-weight:500;font-size:14px;display:block;margin-bottom:2px}
#tip .m{color:var(--muted);font-size:11.5px;margin-top:4px;display:block}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="stage">
  <canvas id="cv" aria-label="Map canvas. Draw land, mountains, forests and rivers."></canvas>
  <div id="grain"></div>
  <div id="popStack" aria-live="polite"></div>
  <div id="design">
    <div id="topbar"><div class="zoom" role="group" aria-label="Zoom"><button id="zoomOut" type="button" aria-label="Zoom out">−</button><button id="zoomFit" type="button" title="Show the whole world">Whole world · 1×</button><button id="zoomIn" type="button" aria-label="Zoom in">+</button></div><button id="undoBtn" type="button">Undo</button><button id="newBtn" type="button">New map</button></div>
    <div id="empty" hidden></div>
    <div id="labels"></div>
    <button id="notesTab" type="button" aria-expanded="false" aria-controls="notesPanel" aria-label="Notes"><span id="notesCount" hidden>0</span><span class="lbl-v">Notes</span></button>
    <section id="notesPanel" hidden aria-label="Notes">
      <header><h3>Notes</h3><button id="notesClear" type="button">Clear</button><button id="notesClose" type="button" aria-label="Close notes">✕</button></header>
      <p id="notesEmpty">What forms on your map, and why, will be listed here.</p>
      <ul id="notesList" aria-live="polite"></ul>
    </section>

    <form id="namePill" hidden>
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M6 26v-6L20 6l6 6-14 14H6z"/><path d="M16.5 9.5l6 6"/></svg>
      <input id="nameInput" maxlength="26" autocomplete="off" aria-label="Name this land">
    </form>

    <section id="card" hidden aria-label="Land details">
      <div class="ctl">
        <button id="cardCollapse" type="button" aria-label="Collapse card"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 21L16 11l11 10"/></svg></button>
        <button id="cardClose" type="button" aria-label="Close card"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l20 20M26 6L6 26"/></svg></button>
      </div>
      <h2 id="cardTitle">Icarus Island</h2>
      <div class="row"><span>Vegetation</span><span class="val" id="vVeg">—</span></div>
      <div class="row"><span>Climate</span><span class="val" id="vClim">—</span></div>
      <div class="row"><span>Animal</span><span class="val" id="vAni">—</span></div>
      <div class="row"><span>Landforms</span><span class="val" id="vLand">—</span></div>
      <div class="row"><span>Survival</span><span class="bar"><span class="track"><span class="fill" id="vBar" style="width:0%"></span></span><span id="vPct">0%</span></span></div>
    </section>
    <div id="cardMini" hidden role="button" tabindex="0"><span id="miniName"></span><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 12l10 10 10-10"/></svg></div>

    <div id="compass" hidden>
      <svg viewBox="0 0 68 68" aria-label="Wind compass. Drag to steer the clouds, double-click to reset.">
        <circle cx="34" cy="34" r="30" fill="var(--paper)" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="34" cy="34" r="25" fill="none" stroke="currentColor" stroke-width=".6" stroke-dasharray="1.5 3"/>
        <text x="34" y="12.5" text-anchor="middle" font-size="7" fill="currentColor" font-family="Fira Sans, sans-serif">N</text>
        <g id="needle" style="transform-origin:34px 34px"><path d="M56 34L34 29.5 12 34l22 4.5z" fill="var(--paper)" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M56 34L34 29.5 34 38.5z" fill="currentColor"/></g>
        <circle cx="34" cy="34" r="2.2" fill="currentColor"/>
      </svg>
      <span id="compassCap">Prevailing wind</span>
    </div>


    <div id="timePill" role="group" aria-label="Time">
      <button id="playBtn" type="button" aria-label="Pause time"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g id="icoPause"><path d="M11 7v18M21 7v18"/></g><g id="icoPlay" style="display:none"><path d="M10 6l16 10-16 10z"/></g></svg></button>
      <div class="tbox"><span id="timeTxt">0 years</span><span id="ageTxt">Interglacial · sea level 0 m</span></div>
      <button id="speedBtn" type="button" title="Change how fast time passes">10k yr/s</button>
    </div>
    <div id="layers" role="group" aria-label="Map layers">
      <button class="lyr" type="button" data-l="winds" aria-pressed="false">Winds</button>
      <button class="lyr" type="button" data-l="currents" aria-pressed="false">Currents</button>
      <button class="lyr" type="button" data-l="plates" aria-pressed="false">Plates</button>
      <button class="lyr" type="button" data-l="rocks" aria-pressed="false">Rocks</button>
      <button class="lyr" type="button" data-l="seafloor" aria-pressed="false">Sea floor</button>
    </div>
    <div id="tip" hidden></div>
    <div id="hint" hidden></div>
    <nav id="navbar" aria-label="Tools">
      <button class="tool" data-tool="pencil" aria-label="Draw land (1)" aria-pressed="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M6 26v-6L20 6l6 6-14 14H6z"/><path d="M16.5 9.5l6 6"/></svg></button>
      <button class="tool" data-tool="mountain" aria-label="Raise mountains (2)" aria-pressed="false"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><circle cx="20.5" cy="7" r="2.4"/><path d="M3 26L12 12l9 14"/><path d="M15.5 17.5L19 13l10 13H3"/></svg></button>
      <button class="tool" data-tool="tree" aria-label="Plant forests (3)" aria-pressed="false"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M16 23c-6 0-8-5-7-10s4-9 7-9 6 4 7 9-1 10-7 10z"/><path d="M16 29V13M16 19l4-4M16 16l-3-3"/></svg></button>
      <button class="tool" data-tool="river" aria-label="Carve rivers (4)" aria-pressed="false"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M5 7l8 2 6-2 8 2v16l-8-2-6 2-8-2z"/><path d="M12 9c7 2-2 6 4 8s-1 5 1 7"/><path d="M15.5 8.5c6 2.5-1.5 6 4 8s-.5 4.5 1 6.5"/></svg></button>
      <button class="tool" data-tool="ruler" aria-label="Measure distance (5)" aria-pressed="false"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M4 20L20 4l8 8-16 16z"/><path d="M9 15l3 3M12.5 11.5l2 2M15.5 8.5l3 3M7 17l1.5 1.5M18 6l1.5 1.5"/></svg></button>
      <button class="tool" data-tool="eraser" aria-label="Erase land (6)" aria-pressed="false"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M17.5 5.5l9 9-12 12h-7l-4-4z"/><path d="M11.5 11.5l9 9"/><path d="M14.5 26.5H28"/></svg></button>
    </nav>
  </div>
</div>

<script>
(() => {
'use strict';
// ---------- constants & tokens ----------
const css = getComputedStyle(document.documentElement);
const tok = (n, d) => (css.getPropertyValue(n).trim() || d);
const PAPER = tok('--paper', '#fff'), INK = tok('--ink', '#6b4e4e'), RULE = tok('--rule', '#a7a3a3'), MUTED = tok('--muted', '#8e7f7f'), HEATC = tok('--heat', '#c9692c');
const LAND = '#cddda0', WATER = '#bad6e0', SNOWC = '#7f9cab', TREEC = '#a9c46f', LAVA = '#e3874a', COLD = '#4f7f99', ICEC = '#eef5f8';
const FONT = '"Fira Sans", "Segoe UI", system-ui, sans-serif';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const W0 = 1280, H0 = 832, FX = 44, FY = 42, FW = 1192, FH = 746;
const C = 4, COLS = Math.ceil(FW / C), ROWS = Math.ceil(FH / C), N = COLS * ROWS;
const ZMAX = 12;
const MORPH = RM ? 0.01 : 1.15, POP = RM ? 0.01 : 0.6, WASH = RM ? 0.01 : 0.9;
const KMY = C / FH * 17760;                       // km per cell north–south
const kmxAt = lat => C / FW * 40000 * Math.max(.05, Math.cos(lat * Math.PI / 180));
const PX_PER_CM = 1 / 3.36e6;                     // 1 world px ≈ 33.6 km

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const stc = document.createElement('canvas'), sx = stc.getContext('2d');
const design = $('design');

// ---------- math helpers ----------
function hash3(a, b, c) { let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 2246822519); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y, seed) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash3(xi, yi, seed), b = hash3(xi + 1, yi, seed), c = hash3(xi, yi + 1, seed), d = hash3(xi + 1, yi + 1, seed);
  return (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v) * 2 - 1;
}
const fbm = (x, y, s) => vnoise(x, y, s) * .6 + vnoise(x * 2.1, y * 2.1, s + 1) * .3 + vnoise(x * 4.3, y * 4.3, s + 2) * .1;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

  $('ageTxt').textContent = `${phase} · ${a >= 0 ? '+' : ''}${a.toFixed(1)}°C · sea ${SL >= 0 ? '+' : ''}${Math.round(SL)} m`;
}
function loop(ms) { requestAnimationFrame(loop); try { frame(ms); } catch (err) { console.error(err); } }
function frame(ms) {
  const now = ms / 1000, dt = Math.min(.05, now - lastT); lastT = now;
  stepCam(dt);
  if (playing) {
    simAcc += dt;
    if (simAcc >= .25) {
      const years = SPEEDS[speedI] * simAcc; simAcc = 0;
      const r = simStep(years); updateTimeUI(r.aNow, r.SL);
      if (geoDirty || (simT - lastGeoSimT > 250000 && now - lastGeoReal > 1.5)) { lastGeoSimT = simT; lastGeoReal = now; geoUpdate(false); islands.forEach(placeHome); renderLabels(); }
      paintOverlay(); if (featDirty) { computeFeatLabels(); refreshVents(); featDirty = false; } announceNews(); fillCard(); staticDirty = true;
    }
  }
  flushToasts();
  let finished = false;
  islands.forEach(isl => { const a = now - isl.born < MORPH + POP + WASH + .1; if (isl._anim && !a) finished = true; isl._anim = a; });
  if (finished) { staticDirty = true; renderLabels(); }
  if (camMoved) { staticDirty = true; positionLabels(); $('zoomFit').textContent = cam.z < 1.01 ? 'Whole world · 1×' : `${cam.z < 10 ? cam.z.toFixed(1) : Math.round(cam.z)}×`; camMoved = false; }
  if (staticDirty) { renderStatic(now); staticDirty = false; }
  if (hover && !drag && tool !== 'eraser' && performance.now() - hoverT > 350 && $('tip').hidden) showTip();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.drawImage(stc, 0, 0);
  setBase(ctx); ZW = 1 / cam.z;
  ctx.save(); ctx.beginPath(); ctx.rect(FX, FY, FW, FH); ctx.clip(); applyCam(ctx); drawAnimated(now, dt); ctx.restore();
}

// ---------- boot: a blank world ----------
makeGrain(); layout(); addEventListener('resize', layout); setTool('pencil');
geoUpdate(true); paintOverlay();
for (let i = 0; i < 10; i++) spawnCloud(); clouds.forEach(c => c.alpha = 1);
renderLabels(); updateCompass(); updateTimeUI(0, 0);
document.fonts && document.fonts.ready.then(() => { staticDirty = true; });
requestAnimationFrame(loop);
})();
</script>
